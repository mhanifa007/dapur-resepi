<style>
/* Susun atur: resepi di kiri, panel menu di kanan (di atas pada telefon). Warna: oren sambal + hijau pandan pada neutral kehijauan. */
:root {
  --bg: #F2F5EE;
  --surface: #FFFFFF;
  --surface-2: #E7EEE0;
  --fg: #1D2B22;
  --muted: #56675B;
  --line: #D3DDC9;
  --accent: #C4540F;
  --accent-ink: #FFFFFF;
  --accent-soft: #FBE4D2;
  --green: #2F7A52;
  --green-ink: #FFFFFF;
  --green-soft: #DCEBDD;
  --font-display: 'Bricolage Grotesque', 'Segoe UI', system-ui, sans-serif;
  --font-body: 'Nunito Sans', 'Segoe UI', system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111913; --surface: #1A251D; --surface-2: #233227; --fg: #E7EFE5; --muted: #9BAE9F; --line: #2E4034;
    --accent: #F28F45; --accent-ink: #1B1006; --accent-soft: #3A2616;
    --green: #74C795; --green-ink: #0C1F14; --green-soft: #203828;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111913; --surface: #1A251D; --surface-2: #233227; --fg: #E7EFE5; --muted: #9BAE9F; --line: #2E4034;
  --accent: #F28F45; --accent-ink: #1B1006; --accent-soft: #3A2616;
  --green: #74C795; --green-ink: #0C1F14; --green-soft: #203828;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 16px; line-height: 1.55;
  padding-block: 20px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.app { max-width: 1180px; margin: 0 auto; display: grid; gap: 20px; }

.top { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px 24px; }
.top h1 { margin: 0; font-family: var(--font-display); font-weight: 800; font-size: 32px; line-height: 1.05; letter-spacing: -0.01em; }
.top p { margin: 4px 0 0; color: var(--muted); }
.search { flex: 1 1 280px; max-width: 460px; }
.search input {
  width: 100%; min-height: 48px; padding: 0 16px; border-radius: 12px;
  border: 1px solid var(--line); background: var(--surface); color: var(--fg); font: inherit;
}
.search input::placeholder { color: var(--muted); }

.layout { display: grid; grid-template-columns: minmax(0, 1fr) 330px; gap: 20px; align-items: start; }

/* Panel menu */
.menu {
  position: sticky; top: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0;
  background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px;
}
.menu-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.menu-head h2 { margin: 0; font-family: var(--font-display); font-size: 20px; font-weight: 800; }
.menu-head span { color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  min-height: 40px; padding: 0 14px; border-radius: 999px; white-space: nowrap;
  border: 1px solid var(--line); background: var(--surface); font-size: 14px; font-weight: 600;
}
.chip[aria-pressed="true"] { background: var(--green); border-color: var(--green); color: var(--green-ink); }
.list { display: flex; flex-direction: column; gap: 6px; }
.item {
  display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; align-items: center; gap: 12px;
  width: 100%; min-height: 60px; padding: 8px 12px; text-align: left;
  border: 1px solid var(--line); border-radius: 12px; background: var(--surface);
}
.item:hover { border-color: var(--accent); }
.item .ic { display: grid; place-items: center; width: 44px; height: 44px; border-radius: 10px; background: var(--surface-2); font-size: 26px; }
.item .tx { display: grid; min-width: 0; }
.item .nm { font-weight: 700; line-height: 1.25; }
.item .sub { font-size: 13px; color: var(--muted); }
.item .st { font-size: 16px; color: var(--accent); }

  function toNum(t) {
    var m;
    t = t.trim();
    if ((m = t.match(/^(\d+)\s+(\d+)\/(\d+)$/))) return +m[1] + m[2] / m[3];
    if ((m = t.match(/^(\d+)\/(\d+)$/))) return m[1] / m[2];
    if ((m = t.match(/^(\d+(?:[.,]\d+)?)?\s*([½¼¾⅓⅔])$/))) return (m[1] ? parseFloat(m[1].replace(',', '.')) : 0) + FR[m[2]];
    return parseFloat(t.replace(',', '.'));
  }
  // Hasil: [kuantiti atau null, unit, nama]
  function parseLine(raw) {
    var line = String(raw).replace(/^[\s\-•*·]+/, '').trim();
    if (!line) return null;
    line = line.replace(/\bsudu\s+(besar|makan)\b/gi, 'sdb').replace(/\bsudu\s+teh\b/gi, 'sdt');
    if (/^\d+\s*[-–]\s*\d/.test(line)) return [null, '', line];
    var m = line.match(/^(\d+\s+\d+\/\d+|\d+\/\d+|\d+(?:[.,]\d+)?\s*[½¼¾⅓⅔]|[½¼¾⅓⅔]|\d+(?:[.,]\d+)?)\s*([A-Za-z]+)?\.?\s*(.*)$/);
    if (!m) return [null, '', line];
    var q = toNum(m[1]);
    if (!(q > 0)) return [null, '', line];
    var w = (m[2] || '').toLowerCase(), rest = m[3].trim();

  function clean(r) {

  function byId(id) { var a = all(); for (var k = 0; k < a.length; k++) if (a[k].id === id) return a[k]; return null; }

  /* ---------- Paparan dan navigasi ---------- */

    if (state.view === 'borang') renderForm();
    else if (state.view === 'sandaran') renderBackup();
    else if (state.view === 'kategori') renderCats();
    else renderRecipe();
    if (notice) { say(notice); notice = ''; }
  }
  function refreshAll() {
    renderChips();
    if (!byId(state.sel)) { var a = all(); state.sel = a.length ? a[0].id : ''; }
    renderList(); render();
  }
  function toMain() {
    if (window.matchMedia('(max-width: 860px)').matches) {
      var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      $('resepi').scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'start' });
    }
  }
  function select(id, fromUser) {
    state.sel = id; state.view = 'resepi'; state.editId = null;
    render(); markActive();
    try { if (location.hash.slice(1) !== id) location.hash = id; } catch (e) {}
    if (fromUser) toMain();
  }
  function refresh() {
    var vis = visible();
    renderList();
    if (vis.length && !vis.some(function (r) { return r.id === state.sel; })) {
      state.sel = vis[0].id;
      if (state.view === 'resepi') renderRecipe();
      markActive();
    }
  }
  function removeRecipe(r) {
    if (r.u) { mine.splice(mineIndex(r.id), 1); write(KEY_MINE, mine); }
    else { hidden[r.id] = 1; write(KEY_HIDE, Object.keys(hidden)); }
    delete favs[r.id]; saveFavs();
    notice = 'Resepi dipadam.';
    refreshAll();
  }

  /* ---------- Acara ---------- */
  $('resepi').addEventListener('click', function (e) {
    var b = e.target.closest('[data-act]'); if (!b) return;
    var a = b.getAttribute('data-act'), r = byId(state.sel);
    if (a === 'inc' || a === 'dec') {
      var s = (serv[r.id] || r.sv) + (a === 'inc' ? 1 : -1);
      serv[r.id] = Math.min(20, Math.max(1, s));
      $('bahan').innerHTML = ingHtml(r); syncStepper(r);
    } else if (a === 'fav') {
      if (favs[r.id]) delete favs[r.id]; else favs[r.id] = 1;
      saveFavs();
      b.setAttribute('aria-pressed', String(!!favs[r.id]));
      b.textContent = favs[r.id] ? '★ Dalam kegemaran' : '☆ Simpan kegemaran';
      renderChips(); renderList();
    } else if (a === 'copy') {
      copyText(recipeText(r), $('salin-teks'), 'status', 'Resepi disalin.', 'Tidak dapat menyalin automatik. Teks sudah dipilih di bawah, salin secara manual.');
    } else if (a === 'edit') {
      state.view = 'borang'; state.editId = r.id; render(); markActive(); toMain();
    } else if (a === 'del') {
      if (!b.dataset.armed) {
        b.dataset.armed = '1'; b.textContent = 'Tekan lagi untuk padam';
        setTimeout(function () { if (b.isConnected) { delete b.dataset.armed; b.textContent = 'Padam'; } }, 4000);
        return;
      }
      removeRecipe(r);
    } else if (a === 'batal') {
      state.view = 'resepi'; state.editId = null; render(); markActive();
    } else if (a === 'salin-sb') {
      copyText(backupText(), $('sandaran'), 'status-sb', 'Sandaran disalin. Simpan di tempat selamat.', 'Tidak dapat menyalin automatik. Teks sudah dipilih, salin secara manual.');
    } else if (a === 'pulih') {
      restore();
    } else if (a === 'kat-del') {
      delCat(b.getAttribute('data-kat'));
    } else if (a === 'contoh') {
      hidden = {}; write(KEY_HIDE, []);
      renderChips(); renderList(); renderBackup(); say('Resepi contoh dipulihkan.', 'status-sb3');
    }
  });
  $('resepi').addEventListener('submit', function (e) {
    if (e.target.id === 'borang') { e.preventDefault(); saveForm(); }
    else if (e.target.id === 'form-kat') { e.preventDefault(); addCat(); }
  });
  $('resepi').addEventListener('change', function (e) {
    var cb = e.target;
    if (!cb.matches || !cb.matches('input[type="checkbox"][data-n]')) return;
    var set = checked[state.sel] || (checked[state.sel] = {});
    set[cb.getAttribute('data-n')] = cb.checked;
  });
  $('senarai').addEventListener('click', function (e) {
    var b = e.target.closest('.item'); if (b) select(b.getAttribute('data-id'), true);
  });
  $('chips').addEventListener('click', function (e) {
    var b = e.target.closest('.chip'); if (!b) return;
    if (b.id === 'chip-fav') state.onlyFav = !state.onlyFav;
    else state.cat = b.getAttribute('data-cat');
    renderChips(); refresh();
  });
  $('cari').addEventListener('input', function (e) { state.q = e.target.value; refresh(); });
  $('btn-tambah').addEventListener('click', function () { state.view = 'borang'; state.editId = null; render(); markActive(); toMain(); });
  $('btn-sandaran').addEventListener('click', function () { state.view = 'sandaran'; state.editId = null; render(); markActive(); toMain(); });
  $('btn-kategori').addEventListener('click', function () { state.view = 'kategori'; state.editId = null; render(); markActive(); toMain(); });
  window.addEventListener('hashchange', function () {
    var r = byId(location.hash.slice(1));
    if (r && (r.id !== state.sel || state.view !== 'resepi')) {
      state.cat = 'Semua'; state.q = ''; state.onlyFav = false; $('cari').value = '';
      renderChips(); renderList(); select(r.id, false);
    }
  });

  var start = byId(location.hash.slice(1));
  if (start) state.sel = start.id;
  if (!write('dapur-resepi-uji', 1)) notice = 'Pelayar ini tidak membenarkan simpanan. Resepi baru akan hilang bila halaman ditutup.';
  refreshAll();
})();
</script>
</body>
</html>
